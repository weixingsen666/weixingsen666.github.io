<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>
  <!-- 圆形背景 -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>
  <!-- 内圈装饰 -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
  <!-- 用户名首字母 W -->
  <text x="100" y="128" text-anchor="middle"
        font-family="'JetBrains Mono','Courier New',monospace"
        font-size="80" font-weight="700" fill="#3a8bd9">W</text>
  <!-- 底部小点装饰 -->
  <circle cx="100" cy="158" r="4" fill="#3a8bd9" opacity="0.5"/>
  <circle cx="100" cy="170" r="2.5" fill="#60a5fa" opacity="0.3"/>
</svg>
