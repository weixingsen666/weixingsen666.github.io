<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf3fc"/>
      <stop offset="100%" stop-color="#d3e5f5"/>
    </linearGradient>
  </defs>
  <!-- 方形背景（与直角卡片风格统一） -->
  <rect width="200" height="200" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="184" height="184" fill="none" stroke="#2f6fb0" stroke-width="1.5" opacity="0.35"/>
  <!-- 姓氏（衬线字） -->
  <text x="100" y="130" text-anchor="middle"
        font-family="'Noto Serif SC','Songti SC',SimSun,serif"
        font-size="84" font-weight="900" fill="#2f6fb0">魏</text>
  <!-- 底部小方块装饰 -->
  <rect x="92" y="158" width="16" height="4" fill="#2f6fb0" opacity="0.5"/>
</svg>
