<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- 圆形背景 -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>
  <!-- 高光 -->
  <circle cx="100" cy="100" r="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- 用户名首字母 W -->
  <text x="100" y="135" text-anchor="middle"
        font-family="'JetBrains Mono','Courier New',monospace"
        font-size="90" font-weight="700" fill="#ffffff">W</text>
  <!-- 装饰圆环 -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="4 6" opacity="0.6"/>
</svg>
